<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成品+材质替换 批量测试效果页</title><link rel="stylesheet" href="style.css?v=20261029-material-names"><body>
<header><div class="header-top"><h1>成品+材质替换 批量测试效果页</h1></div><div class="header-bottom"><nav id="stages" aria-label="测试方案"><div id="schemeABGroup" class="scheme-group"><button data-scheme="AB">方案A/B对比</button></div><div id="schemeAGroup" class="scheme-group"><button data-scheme="A">方案A：混合模式</button></div><div id="schemeBGroup" class="scheme-group"><button data-scheme="B" aria-controls="stepViews" aria-expanded="false">方案B：分步替换模式</button><div id="stepViews" inert aria-hidden="true" role="group" aria-label="方案B步骤筛选"><div class="step-reveal-inner"><button data-stage="product" aria-pressed="false">第一步：成品替换</button><button data-stage="material" aria-pressed="false">第二步：材质替换</button></div></div></div></nav><span id="summary"></span></div></header>
<div class="workspace"><aside class="catalog"><select id="round"></select><input id="search" placeholder="搜索编号、家具或场景"><div class="filters"><select id="room"><option value="">全部场景</option><option>客餐厅</option><option>卧室</option></select><select id="grade"><option value="">全部效果</option><option>可用</option><option>基本可用</option><option>基本不可用</option><option>不可用</option></select></div><div id="list"></div></aside>
<main><div class="title"><h2 id="title"></h2><span id="position"></span><button id="prev" aria-label="上一组">‹</button><button id="next" aria-label="下一组">›</button></div><div id="abCompare" aria-label="方案A/B最终结果对比"></div><div id="canvas"><div id="leftView" class="view"><img id="before" draggable="false"></div><div id="rightView" class="view"><img id="after" draggable="false"></div><div id="split" role="slider" tabindex="0" aria-label="对比原图" aria-valuemin="0" aria-valuemax="100"><span>‹ ›</span></div><span class="image-label left" id="leftLabel">标签位置</span><span class="image-label right">结果图</span><div id="empty"></div></div><div class="toolbar"><button data-view="after" class="active" aria-pressed="true">结果图</button><button data-view="compare" aria-pressed="false">对比原图</button><button data-view="before" aria-pressed="false">查看标签区域</button><button id="reset">复位</button><span id="zoom">100%</span></div></main>
<aside class="details"><div id="references"></div><section id="abReviewSection"><div id="abReviews"></div></section><section><h3 id="reviewTitle">人工初评</h3><div id="review"></div></section><section id="aiReviewSection"><h3>AI细评</h3><div id="aiReview"></div></section><details><summary>实际提示词</summary><pre id="prompt"></pre><button id="copy">复制提示词</button></details><details><summary>任务快照</summary><pre id="snapshot"></pre></details></aside></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalbar"><div class="modal-heading"><b id="modalTitle"></b><span id="modalMaterial" hidden></span></div><button id="close">关闭</button></div><img id="large" draggable="false"></div><script src="viewer.js?v=20261029-material-names"></script></body></html>
